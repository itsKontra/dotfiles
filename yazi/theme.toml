# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[mgr]
cwd = { fg = "#7FBBB3" }

hovered = { fg = "#A7C080", bg = "#2E383C" }
preview_hovered = { underline = true }

find_keyword = { fg = "#83C092", bold = true }
find_position = { fg = "#7FBBB3", bold = true }

marker_copied = { fg = "#83C092", bg = "#83C092" }
marker_cut = { fg = "#E67E80", bg = "#E67E80" }
marker_marked = { fg = "#7FBBB3", bg = "#7FBBB3" }
marker_selected = { fg = "#A7C080", bg = "#A7C080" }

tab_active = { fg = "#1E2326", bg = "#A7C080" }
tab_inactive = { fg = "#9DA9A0", bg = "#2E383C" }

border_symbol = "│"
border_style = { fg = "#4c544f" }

[mode]
normal_main = { fg = "#1E2326", bg = "#A7C080", bold = true }
normal_alt = { fg = "#A7C080", bg = "#2E383C" }
select_main = { fg = "#1E2326", bg = "#83C092", bold = true }
select_alt = { fg = "#83C092", bg = "#2E383C" }
unset_main = { fg = "#1E2326", bg = "#E67E80", bold = true }
unset_alt = { fg = "#E67E80", bg = "#2E383C" }

[status]
progress_label = { fg = "#D3C6AA", bold = true }
progress_normal = { fg = "#A7C080", bg = "#2E383C" }
progress_error = { fg = "#E67E80", bg = "#2E383C" }

[input]
border = { fg = "#A7C080" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#A7C080" }
active = { fg = "#83C092", bold = true }
inactive = {}

[cmp]
border = { fg = "#A7C080" }
active = { fg = "#83C092", bold = true }
inactive = {}

[tasks]
border = { fg = "#A7C080" }
title = {}
hovered = { fg = "#83C092", underline = true }

[which]
mask = { bg = "#2E383C" }
cand = { fg = "#7FBBB3" }
rest = { fg = "#9DA9A0" }
desc = { fg = "#83C092" }
separator = "  "
separator_style = { fg = "#7A8478" }

[help]
on = { fg = "#7FBBB3" }
run = { fg = "#83C092" }
hovered = { reversed = true, bold = true }
footer = { fg = "#D3C6AA", bg = "#2E383C" }

[notify]
title_info = { fg = "#A7C080" }
title_warn = { fg = "#83C092" }
title_error = { fg = "#E67E80" }

# the file list itself: dirs and file kinds carry the palette so yazi matches
# kitty's ANSI colours (base16), not yazi's built-in defaults. First match wins,
# so the "*" fallback stays last.
[filetype]
rules = [
	{ mime = "image/*", fg = "#83C092" },
	{ mime = "{audio,video}/*", fg = "#A7C080" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "#A7C080" },
	{ url = "*", is = "orphan", fg = "#E67E80" },
	{ url = "*", is = "exec", fg = "#83C092" },
	{ url = "*/", fg = "#7FBBB3", bold = true },
	{ url = "*", fg = "#D3C6AA" },
]
