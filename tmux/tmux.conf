# ~/.config/tmux/tmux.conf

# Source Ryoku auto-generated theme colors (Matugen)
if-shell "test -f ~/.config/tmux/ryoku-colors.conf" "source-file ~/.config/tmux/ryoku-colors.conf"

# Tmux-Sessionizer (Primeagen)
# Prefix + f: open fuzzy finder in a new tmux window
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Prefix + C-f: open in a centered floating popup
bind-key -r C-f display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"

# Session commands (corresponds to TS_SESSION_COMMANDS indices in tmux-sessionizer.conf)
bind-key -r M-h run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 3"
