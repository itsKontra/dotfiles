# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0e0e09"
set -gq @thm_bar_bg                       "#0e0e09"

set -gq @thm_bg                           "#14140e"
set -gq @thm_fg                           "#e5e2d8"
set -gq @thm_primary                      "#c9cc70"
set -gq @thm_inverse_primary              "#5f6210"
set -gq @thm_surface_low                  "#1c1c16"
set -gq @thm_surface                      "#202019"
set -gq @thm_surface_variant              "#2b2a23"
set -gq @thm_outline                      "#484839"
set -gq @thm_text_variant                 "#c9c7b4"

# Re-set the options that read the vars above.
set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"
