# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[mgr]
cwd = { fg = "#9CCFD8" }

hovered = { fg = "#C4A7E7", bg = "#26233A" }
preview_hovered = { underline = true }

find_keyword = { fg = "#EBBCBA", bold = true }
find_position = { fg = "#9CCFD8", bold = true }

marker_copied = { fg = "#EBBCBA", bg = "#EBBCBA" }
marker_cut = { fg = "#EB6F92", bg = "#EB6F92" }
marker_marked = { fg = "#9CCFD8", bg = "#9CCFD8" }
marker_selected = { fg = "#C4A7E7", bg = "#C4A7E7" }

tab_active = { fg = "#191724", bg = "#C4A7E7" }
tab_inactive = { fg = "#908CAA", bg = "#26233A" }

border_symbol = "│"
border_style = { fg = "#403D52" }

[mode]
normal_main = { fg = "#191724", bg = "#C4A7E7", bold = true }
normal_alt = { fg = "#C4A7E7", bg = "#26233A" }
select_main = { fg = "#191724", bg = "#EBBCBA", bold = true }
select_alt = { fg = "#EBBCBA", bg = "#26233A" }
unset_main = { fg = "#191724", bg = "#EB6F92", bold = true }
unset_alt = { fg = "#EB6F92", bg = "#26233A" }

[status]
progress_label = { fg = "#E0DEF4", bold = true }
progress_normal = { fg = "#C4A7E7", bg = "#26233A" }
progress_error = { fg = "#EB6F92", bg = "#26233A" }

[input]
border = { fg = "#C4A7E7" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#C4A7E7" }
active = { fg = "#EBBCBA", bold = true }
inactive = {}

[cmp]
border = { fg = "#C4A7E7" }
active = { fg = "#EBBCBA", bold = true }
inactive = {}

[tasks]
border = { fg = "#C4A7E7" }
title = {}
hovered = { fg = "#EBBCBA", underline = true }

[which]
mask = { bg = "#26233A" }
cand = { fg = "#9CCFD8" }
rest = { fg = "#908CAA" }
desc = { fg = "#EBBCBA" }
separator = "  "
separator_style = { fg = "#6E6A86" }

[help]
on = { fg = "#9CCFD8" }
run = { fg = "#EBBCBA" }
hovered = { reversed = true, bold = true }
footer = { fg = "#E0DEF4", bg = "#26233A" }

[notify]
title_info = { fg = "#C4A7E7" }
title_warn = { fg = "#EBBCBA" }
title_error = { fg = "#EB6F92" }

# the file list itself: dirs and file kinds carry the palette so yazi matches
# kitty's ANSI colours (base16), not yazi's built-in defaults. First match wins,
# so the "*" fallback stays last.
[filetype]
rules = [
	{ mime = "image/*", fg = "#EBBCBA" },
	{ mime = "{audio,video}/*", fg = "#C4A7E7" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "#C4A7E7" },
	{ url = "*", is = "orphan", fg = "#EB6F92" },
	{ url = "*", is = "exec", fg = "#EBBCBA" },
	{ url = "*/", fg = "#9CCFD8", bold = true },
	{ url = "*", fg = "#E0DEF4" },
]
